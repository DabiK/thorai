<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dictée L2 en cours</title>
<link rel="stylesheet" href="../outils/thorai-pixel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>body{margin:0}.term{background:#D9F0C4;padding:0 10px;box-shadow:inset 0 -4px 0 #1A8657}.rec{width:28px;height:28px;background:#C2412D;animation:pulse .8s steps(1) infinite}</style>
</helmet>
<div class="thor t-aube" style="width: 1920px; height: 2200px;">
  <div class="top">
    <img class="px world" src="../assets/aube/maison-scribe.png" alt="Le coursier parle au scribe">
    <div class="frame bubble" style="left: 1010px; top: 760px; display: flex; align-items: center; gap: 18px; padding: 16px 22px;">
      <div class="meter" style="height: 48px;"><i style="height: 30%;"></i><i style="height: 80%;"></i><i style="height: 55%;"></i><i style="height: 100%;"></i><i style="height: 45%;"></i><i style="height: 70%;"></i></div>
      <span class="tail" style="left: -10px; bottom: 6px; transform: rotate(90deg);"></span>
    </div>
    <div class="frame bubble" style="left: 1060px; top: 250px; font-size: 40px; padding: 10px 22px;">…<span class="tail" style="left: 30px; bottom: -26px;"></span></div>
    <div class="pbox" style="position: absolute; left: 44px; top: 40px; padding: 14px 22px; display: flex; flex-direction: column; gap: 4px;">
      <span class="disp" style="font-size: 44px;">regie</span>
      <span class="muted" style="font-size: 24px;">tri des sessions · Claude</span>
    </div>
  </div>
  <div class="hinge"></div>
  <div class="bot">
    <div class="screen">
      <div class="head">
        <h1>Dictée pour Claude</h1>
        <span style="display: flex; align-items: center; gap: 14px; font-size: 30px;"><span class="rec"></span>0:07</span>
      </div>
      <div class="body" style="padding-top: 8px; gap: 26px;">
        <div class="frame" style="margin: 10px; padding: 36px 40px; font-size: 57px; line-height: 1.3; min-height: 520px; box-sizing: border-box;">
          Oui, et range les sessions en pause tout en bas, sous celles qui attendent. Garde <span class="term code" style="font-size: 62px;">updatedAt</span> pour le reste <span class="muted">de la</span>
        </div>
        <div style="display: flex; align-items: center; gap: 24px; padding: 0 14px;">
          <div class="meter"><i style="height: 25%;"></i><i style="height: 60%;"></i><i style="height: 90%;"></i><i style="height: 100%;"></i><i style="height: 70%;"></i><i style="height: 40%;"></i><i style="height: 85%;"></i><i style="height: 55%;"></i><i style="height: 30%;"></i><i style="height: 15%;"></i></div>
          <span class="muted" style="font-size: 26px;">Termes du dépôt reconnus en vert.</span>
        </div>
      </div>
      <div class="hints">
        <span class="hint"><span class="k">L2</span>Relâcher pour relire</span>
        <span class="hint muted" style="color: #BFD8C8;">Ensuite : <span class="k r">A</span>Envoyer <span class="k r">B</span>Effacer <span class="k r">X</span>Corriger <span class="k r">Y</span>Compléter</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":2200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
